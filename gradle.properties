# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html
# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
# Daemon left off on purpose: a resident Gradle/Kotlin daemon (each a multi-GB JVM) sitting idle
# after CLI builds can compound memory pressure on constrained machines. Every CLI build pays a
# cold-start cost instead of reusing a warm daemon. NOTE (from the file's own header above):
# Android Studio's own Gradle settings can still override this for IDE-triggered builds — this
# only reliably applies to `./gradlew` from the command line.
org.gradle.daemon=false
# Kotlin code style for this project: "official" or "obsolete":
kotlin.code.style=official
android.enableR8.fullMode=true
